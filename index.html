<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Georgia', serif;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.48), transparent 34%),
                linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .page-vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 160px rgba(60, 0, 30, 0.28);
        }

        .glow-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.30), transparent 18%),
                radial-gradient(circle at 80% 28%, rgba(255,255,255,0.18), transparent 20%),
                radial-gradient(circle at 50% 78%, rgba(255,215,235,0.20), transparent 22%);
            filter: blur(38px);
            opacity: 0.95;
            z-index: 0;
            animation: driftGlow 10s ease-in-out infinite alternate;
        }

        @keyframes driftGlow {
            from { transform: translateY(0px) scale(1); }
            to { transform: translateY(-14px) scale(1.03); }
        }

        .intro-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: fadeOut 1s ease 2.6s forwards;
        }

        .intro-box {
            background: rgba(255,255,255,0.93);
            padding: 40px 50px;
            border-radius: 26px;
            text-align: center;
            box-shadow: 0 22px 60px rgba(0,0,0,0.22);
            animation: popIn 0.8s ease;
            border: 2px solid rgba(233, 30, 99, 0.15);
            position: relative;
            overflow: hidden;
        }

        .intro-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
            transform: translateX(-120%);
            animation: shimmer 1.8s ease-in-out infinite;
            pointer-events: none;
        }

        .intro-heart {
            font-size: 2.8em;
            margin-bottom: 12px;
            animation: pulseHeart 1.2s ease-in-out infinite;
        }

        .intro-box h2 {
            font-family: Algerian, serif;
            color: #e91e63;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .intro-box p {
            font-family: Algerian, serif;
            color: #c2185b;
            font-size: 1.1em;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(120%); }
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .finale-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 99990;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.78) 18%, rgba(255,255,255,0.20) 45%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transform: scale(0.6);
            animation: finaleBurst 2.4s ease-out 0.4s forwards;
        }

        .finale-overlay::before {
            content: "💖";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            font-size: 5rem;
            animation: finaleHeart 2.4s ease-out 0.4s forwards;
        }

        .finale-overlay::after {
            content: "For My Love";
            position: absolute;
            left: 50%;
            top: calc(50% + 90px);
            transform: translateX(-50%);
            font-family: Algerian, serif;
            color: #e91e63;
            font-size: 2rem;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: finaleText 2.4s ease-out 0.4s forwards;
        }

        @keyframes finaleBurst {
            0% { opacity: 0; transform: scale(0.4); }
            18% { opacity: 1; transform: scale(1); }
            70% { opacity: 0.95; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(1.45); }
        }

        @keyframes finaleHeart {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(0deg); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(-8deg); }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.0) rotate(8deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.7) rotate(0deg); }
        }

        @keyframes finaleText {
            0% { opacity: 0; transform: translateX(-50%) translateY(14px); }
            30% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        .hearts-bg,
        .sparkles-bg,
        .petals-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart-bg,
        .sparkle,
        .petal {
            position: absolute;
            user-select: none;
        }

        .heart-bg {
            opacity: 0.22;
            animation: float-up 15s linear infinite;
        }

        .sparkle {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 12px rgba(255,255,255,0.85);
            animation: sparkleTwinkle 2.8s ease-in-out infinite;
        }

        .petal {
            font-size: 18px;
            opacity: 0.35;
            animation: petalFall linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.25;
            }
            100% {
                transform: translateY(-120px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes sparkleTwinkle {
            0%, 100% { transform: scale(0.5); opacity: 0.2; }
            50% { transform: scale(1.35); opacity: 1; }
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            100% {
                transform: translateY(110vh) translateX(60px) rotate(360deg);
                opacity: 0;
            }
        }

        .letter-container {
            background: rgba(255,255,255,0.97);
            padding: 60px 50px;
            border-radius: 24px;
            box-shadow:
                0 18px 45px rgba(0,0,0,0.12),
                0 0 0 1px rgba(255,255,255,0.55) inset;
            max-width: 700px;
            position: relative;
            z-index: 10;
            animation: pageRise 1s ease;
        }

        .letter-container::before {
            content: "💌";
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pageRise {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h1 {
            color: #e91e63;
            font-size: 2.8em;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.08);
        }

        .typing-line {
            display: inline-block;
            min-height: 1.9em;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            background: #e91e63;
            margin-left: 6px;
            vertical-align: -2px;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .img-top-left,
        .img-middle-side {
            object-fit: cover;
            border-radius: 22px;
            padding: 6px;
            border: 4px solid transparent;
            background:
                linear-gradient(white, white) padding-box,
                linear-gradient(135deg, #ffd36a, #fff2b3, #d4af37, #fff8dc) border-box;
            box-shadow: 0 12px 28px rgba(0,0,0,0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .img-top-left:hover,
        .img-middle-side:hover {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 18px 34px rgba(0,0,0,0.22);
        }

        .img-top-left {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 90px;
            height: 90px;
            z-index: 20;
        }

        .img-middle-side {
            position: absolute;
            right: -110px;
            top: 45%;
            transform: translateY(-50%);
            width: 100px;
            height: 100px;
            z-index: 20;
        }

        .video-end {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 30px auto 0;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .media-caption {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 1.05em;
            color: #c2185b;
            font-family: Algerian, serif;
        }

        .letter {
            font-size: 1.2em;
            line-height: 1.9;
            color: #333;
            white-space: pre-line;
            margin-top: 10px;
            font-style: italic;
        }

        .signature {
            margin-top: 40px;
            text-align: right;
            font-style: italic;
            color: #e91e63;
            font-size: 1.4em;
            font-weight: bold;
        }

        .heart {
            text-align: center;
            margin-top: 30px;
            font-size: 3em;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .rosey {
            text-align: center;
            margin-top: 20px;
            font-size: 1.5em;
            color: #e91e63;
        }

        #bg-music {
            display: none;
        }

        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #e91e63, #ff5f8f);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            z-index: 9999;
            box-shadow: 0 10px 24px rgba(233,30,99,0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #music-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(233,30,99,0.34);
        }

        @media (max-width: 768px) {
            body {
                padding: 22px 14px;
            }

            .letter-container {
                padding: 38px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 2.1em;
            }

            .letter {
                font-size: 1.05em;
            }

            .img-top-left,
            .img-middle-side {
                position: static;
                display: block;
                margin: 15px auto;
                transform: none;
            }

            #music-btn {
                top: 12px;
                right: 12px;
                font-size: 14px;
                padding: 9px 14px;
            }

            .intro-box {
                padding: 30px 24px;
                width: calc(100vw - 34px);
            }

            .intro-box h2 {
                font-size: 1.6em;
            }

            .finale-overlay::after {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="page-vignette"></div>
    <div class="finale-overlay" id="finaleOverlay"></div>

    <div class="hearts-bg" id="heartsBg"></div>
    <div class="sparkles-bg" id="sparklesBg"></div>
    <div class="petals-bg" id="petalsBg"></div>

    <div id="introScreen" class="intro-screen">
        <div class="intro-box">
            <div class="intro-heart">💖</div>
            <h2>A little surprise for my snowman 💕</h2>
            <p>Open with a smile...</p>
        </div>
    </div>

    <div class="letter-container">
        <h1><span id="typedTitle" class="typing-line"></span><span class="cursor"></span></h1>

        <img src="photo1.jpg" class="img-top-left" alt="Photo 1">
        <div class="media-caption">favourite chashmish</div>

        <div class="letter" id="typedLetter"></div>

        <img src="photo2.jpg" class="img-middle-side" alt="Photo 2">
        <div class="media-caption">the prettiest snowman</div>

        <video class="video-end" controls>
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="media-caption">the greatest Girlfriend</div>

        <div class="signature">
            Forever yours,<br>
            Manas Jain (Snowman's husband) 💖
        </div>

        <div class="heart">💗</div>
        <div class="rosey">I Love You ❤️</div>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn">💕 Play Music</button>

    <script>
        const titleWords = ["My", "Dearest", "Disha", "Jain", "💕"];
        const letterText = `My Dearest Disha (Jain) 💕

I don't think you will ever truly understand how much you mean to me. You are not just my girlfriend, you've become such an important part of my life, my happiness, my comfort, and my heart. I need you in ways that are hard to explain, not because I cannot live without you, but because life feels so much more beautiful, meaningful, and complete when you are in it. You are the person I want to share my thoughts with, the person I look for when something good happens, the person I want to be with when life gets difficult, and the person for whom I want to become my best.

I care about you more than words can ever express. Your happiness matters to me, your feelings matter to me, and your dreams matter to me. When you are happy, I find myself smiling. I want to protect your heart, support you with every chuunauti, and remind you every day how lovely and special you are to me.

There are countless reasons why I love you. I love your beautiful heart. I love the way you make me feel understood. I love your smile. I love your laugh because it is one of my favorite sounds in the world. I love the way you care, the way you think, the way you speak, your eyes, your sundarta, your glasses, your height, and even the little things you do without realizing how special they are to me.

With you, I do not have to hide my true feelings. You make me feel loved, valued, and understood in a way no one else ever has. You inspire me to be better, to dream bigger, and to appreciate the little things in life.

No matter how many times I say I love you, it will never feel like enough because what I feel for you can never be expressed by just three words. You are one of the most precious people in my life, and I am grateful that I get to love you. My heart chooses you today, tomorrow, and every day after that.`;

        function createHearts() {
            const container = document.getElementById('heartsBg');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '❤️'];
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (10 + Math.random() * 10) + 's';
                heart.style.animationDelay = (Math.random() * 10) + 's';
                heart.style.fontSize = (15 + Math.random() * 20) + 'px';
                container.appendChild(heart);
            }
        }

        function createSparkles() {
            const container = document.getElementById('sparklesBg');
            for (let i = 0; i < 34; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                s.style.animationDuration = (2 + Math.random() * 2) + 's';
                s.style.transform = `scale(${0.5 + Math.random() * 1.4})`;
                container.appendChild(s);
            }
        }

        function createPetals() {
            const container = document.getElementById('petalsBg');
            const petals = ['🌸', '🌺', '💮'];
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                p.textContent = petals[Math.floor(Math.random() * petals.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (12 + Math.random() * 10) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.fontSize = (14 + Math.random() * 16) + 'px';
                container.appendChild(p);
            }
        }

        function burstConfetti(x, y) {
            const colors = ['#ff4d88', '#ffb3c7', '#ffd36a', '#ffffff', '#f8a5c2'];
            for (let i = 0; i < 36; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed';
                c.style.left = x + 'px';
                c.style.top = y + 'px';
                c.style.width = (5 + Math.random() * 6) + 'px';
                c.style.height = c.style.width;
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.pointerEvents = 'none';
                c.style.zIndex = '99998';
                c.style.boxShadow = '0 0 10px rgba(255,255,255,0.6)';
                document.body.appendChild(c);

                const angle = Math.random() * Math.PI * 2;
                const dist = 70 + Math.random() * 170;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist - 40;
                const rot = (Math.random() * 720 - 360);

                c.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
                ], {
                    duration: 900 + Math.random() * 500,
                    easing: 'ease-out',
                    fill: 'forwards'
                });

                setTimeout(() => c.remove(), 1600);
            }
        }

        function typeWordByWord(el, words, delay, done) {
            let i = 0;
            el.textContent = '';
            function next() {
                if (i < words.length) {
                    el.textContent += (i === 0 ? '' : ' ') + words[i];
                    i++;
                    setTimeout(next, delay);
                } else if (done) {
                    done();
                }
            }
            next();
        }

        function typeCharByChar(el, text, speed) {
            let i = 0;
            el.textContent = '';
            function step() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(step, speed);
                }
            }
            step();
        }

        createHearts();
        createSparkles();
        createPetals();

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#music-btn') && !e.target.closest('video')) {
                burstConfetti(e.clientX, e.clientY);
            }
        });

        setTimeout(() => {
            const overlay = document.getElementById('finaleOverlay');
            overlay.style.animation = 'none';
            overlay.offsetHeight;
            overlay.style.animation = '';
        }, 0);

        setTimeout(() => {
            typeWordByWord(document.getElementById('typedTitle'), titleWords, 300);
        }, 2600);

        setTimeout(() => {
            typeCharByChar(document.getElementById('typedLetter'), letterText, 12);
        }, 3800);

        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;
        const startAt = 44;
        const endAt = 66;

        musicBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '💕 Play Music';
                isPlaying = false;
                return;
            }

            const startMusic = () => {
                music.currentTime = startAt;
                music.play();
                musicBtn.textContent = '🔇 Pause Music';
                isPlaying = true;
            };

            if (music.readyState >= 2) {
                startMusic();
            } else {
                music.addEventListener('canplay', startMusic, { once: true });
                music.load();
            }
        });

        music.addEventListener('timeupdate', () => {
            if (music.currentTime >= endAt) {
                music.currentTime = startAt;
                musicBtn.textContent = '💕 Play Music';
                isPlaying = false;
            }
        });

        music.addEventListener('ended', () => {
            music.currentTime = startAt;
            musicBtn.textContent = '💕 Play Music';
            isPlaying = false;
        });
    </script>
</body>
</html>
